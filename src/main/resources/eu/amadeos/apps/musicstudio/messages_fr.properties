instrument.piano=Piano
instrument.piano.about=Des cordes frappées qui résonnent puis s'éteignent. Va avec tout, seul ou accompagné.
instrument.electric-piano=Piano électrique
instrument.electric-piano.about=Des touches douces, comme des clochettes. Le son des accords détendus du Lo-Fi.
instrument.organ=Orgue
instrument.organ.about=Des tuyaux qui sonnent tant que la touche est enfoncée. Accords chauds et notes longues.
instrument.bells=Clochettes
instrument.bells.about=De petites cloches à la résonance longue et scintillante. Pour des mélodies calmes.
instrument.marimba=Marimba
instrument.marimba.about=Des lames de bois frappées par des mailloches douces. Court et chaud, bien pour les mélodies Acoustique, Lo-Fi et Chiptune.
instrument.strings=Cordes
instrument.strings.about=Un pupitre de cordes qui s'enfle et tient. De grands accords pour Aventure et Ambient.
instrument.harp=Harpe
instrument.harp.about=Des cordes pincées qui sonnent longtemps. Belle pour les accords arpégés.
instrument.guitar=Guitare pincée
instrument.guitar.about=Des cordes en nylon, pincées ou grattées. Le son feu de camp d'Acoustique.
instrument.flute=Flûte
instrument.flute.about=Un son de vent doux et soufflé. Chante les mélodies au-dessus du reste.
instrument.warm-pad=Nappe chaude
instrument.warm-pad.about=Un tapis de synthétiseur doux qui monte lentement. Le fond d'Ambient et de Méditation.
instrument.synth-lead=Lead synthé
instrument.synth-lead.about=Une voix de synthétiseur claire qui perce. Pour les mélodies Électro.
instrument.chip-square=Chip carré
instrument.chip-square.about=L'onde carrée des vieilles consoles de jeu. Mélodies et accords en Chiptune.
instrument.chip-triangle=Chip triangle
instrument.chip-triangle.about=L'onde triangle douce des vieilles consoles de jeu, surtout pour la basse.
instrument.electric-bass=Basse électrique
instrument.electric-bass.about=Une basse pincée, ronde et courte.
instrument.synth-bass=Basse synthé
instrument.synth-bass.about=Une basse de synthétiseur avec filtre. Ferme et moderne.
instrument.sub-bass=Sub-basse
instrument.sub-bass.about=Un son grave presque pur, qu'on sent plus qu'on ne l'entend. Demande de bons haut-parleurs.
instrument.male-ooh=Voix d'homme Ouh
instrument.male-ooh.about=Un homme chante un « ouh » doux et sombre. Chaleureux pour les mélodies et les longues notes de basse.
instrument.male-aah=Voix d'homme Aah
instrument.male-aah.about=Un homme chante un « aah » ouvert. Porte clairement une mélodie.
instrument.female-ooh=Voix de femme Ouh
instrument.female-ooh.about=Une femme chante un « ouh » doux. Des mélodies délicates au-dessus de tout le reste.
instrument.female-aah=Voix de femme Aah
instrument.female-aah.about=Une femme chante un « aah » ouvert. Claire et lumineuse, pour les mélodies qui doivent briller.
instrument.child-ooh=Voix d'enfant Ouh
instrument.child-ooh.about=Un enfant chante « ouh » : léger et pur, avec peu de vibrato.
instrument.child-aah=Voix d'enfant Aah
instrument.child-aah.about=Un enfant chante « aah » : clair et pur, avec peu de vibrato.
instrument.choir-ooh=Chœur Ouh
instrument.choir-ooh.about=Six voix sur un « ouh » doux, des hommes pour les notes graves et des femmes pour les aiguës. Un tapis d'accords paisible.
instrument.choir-aah=Chœur Aah
instrument.choir-aah.about=Six voix sur un « aah » ouvert. De grands accords pour Aventure et Ambient.
instrument.choir-mmm=Chœur bouche fermée
instrument.choir-mmm.about=Six voix qui fredonnent bouche fermée. Sombre et proche, bien sous une mélodie.

