instrument.piano=Klavier
instrument.piano.about=Angeschlagene Saiten, die nachklingen und verklingen. Passt zu allem, allein oder mit anderen.
instrument.electric-piano=E-Piano
instrument.electric-piano.about=Weiche, glockenartige Tasten. Der Klang entspannter Akkorde im Lo-Fi.
instrument.organ=Orgel
instrument.organ.about=Pfeifen, die klingen, solange die Taste gedrückt ist. Warme Akkorde und lange Töne.
instrument.bells=Glocken
instrument.bells.about=Kleine Glocken mit langem, schimmerndem Nachklang. Gut für ruhige Melodien.
instrument.marimba=Marimba
instrument.marimba.about=Holzstäbe, mit weichen Schlägeln angeschlagen. Kurz und warm, gut für Melodien in Akustik-, Lo-Fi- und Chiptune-Stücken.
instrument.strings=Streicher
instrument.strings.about=Ein Streichorchester, das anschwillt und hält. Große Akkorde für Abenteuer und Ambient.
instrument.harp=Harfe
instrument.harp.about=Gezupfte Saiten, die lange klingen. Schön für gebrochene Akkorde.
instrument.guitar=Zupfgitarre
instrument.guitar.about=Nylonsaiten, gezupft oder geschlagen. Der Lagerfeuerklang von Akustik.
instrument.flute=Flöte
instrument.flute.about=Ein hauchiger, weicher Bläserklang. Singt Melodien über allem anderen.
instrument.warm-pad=Warme Fläche
instrument.warm-pad.about=Ein weicher Synthesizer-Teppich, der langsam einblendet. Der Grund von Ambient und Meditation.
instrument.synth-lead=Synth-Lead
instrument.synth-lead.about=Eine helle Synthesizer-Stimme, die sich durchsetzt. Für Electro-Melodien.
instrument.chip-square=Chip-Rechteck
instrument.chip-square.about=Die Rechteckwelle alter Spielkonsolen. Melodien und Akkorde im Chiptune.
instrument.chip-triangle=Chip-Dreieck
instrument.chip-triangle.about=Die weiche Dreieckwelle alter Spielkonsolen, meist für den Bass.
instrument.electric-bass=E-Bass
instrument.electric-bass.about=Ein gezupfter Bass, rund und kurz.
instrument.synth-bass=Synth-Bass
instrument.synth-bass.about=Ein Synthesizer-Bass mit Filter. Fest und modern.
instrument.sub-bass=Sub-Bass
instrument.sub-bass.about=Ein tiefer, fast reiner Ton, den man mehr spürt als hört. Braucht gute Lautsprecher.
instrument.male-ooh=Männerstimme Uuh
instrument.male-ooh.about=Ein Mann singt ein weiches, dunkles „Uuh“. Warm für Melodien und lange Basstöne.
instrument.male-aah=Männerstimme Aah
instrument.male-aah.about=Ein Mann singt ein offenes „Aah“. Trägt eine Melodie deutlich.
instrument.female-ooh=Frauenstimme Uuh
instrument.female-ooh.about=Eine Frau singt ein weiches „Uuh“. Sanfte Melodien über allem anderen.
instrument.female-aah=Frauenstimme Aah
instrument.female-aah.about=Eine Frau singt ein offenes „Aah“. Hell und klar, für Melodien, die strahlen sollen.
instrument.child-ooh=Kinderstimme Uuh
instrument.child-ooh.about=Ein Kind singt „Uuh“: leicht und rein, mit wenig Vibrato.
instrument.child-aah=Kinderstimme Aah
instrument.child-aah.about=Ein Kind singt „Aah“: hell und rein, mit wenig Vibrato.
instrument.choir-ooh=Chor Uuh
instrument.choir-ooh.about=Sechs Stimmen auf einem weichen „Uuh“, Männer für tiefe und Frauen für hohe Töne. Ein ruhiger Akkordteppich.
instrument.choir-aah=Chor Aah
instrument.choir-aah.about=Sechs Stimmen auf einem offenen „Aah“. Große Akkorde für Abenteuer und Ambient.
instrument.choir-mmm=Chor Summen
instrument.choir-mmm.about=Sechs Stimmen summen mit geschlossenen Lippen. Dunkel und nah, gut unter einer Melodie.
instrument.distorted-guitar=Verzerrte E-Gitarre
instrument.distorted-guitar.about=Eine E-Gitarre über einen übersteuerten Verstärker: rau, laut und lang. Kurze Töne klingen abgedämpft. Der Klang von Heavy Metal und Rock.
instrument.electric-guitar=E-Gitarre
instrument.electric-guitar.about=Stahlsaiten, unverzerrt und hell. Kurze Akkorde neben dem Schlag im Reggae, sonst Melodien und gebrochene Akkorde.
instrument.vibraphone=Vibraphon
instrument.vibraphone.about=Metallplatten mit weichem, schwebendem Nachklang. Die Melodie in Lounge und Jazz.
instrument.saxophone=Saxophon
instrument.saxophone.about=Ein Rohrblattinstrument, warm und etwas rau, das wie eine Stimme singt. Der Solist im Jazz.
instrument.upright-bass=Kontrabass
instrument.upright-bass.about=Ein gezupfter Kontrabass: ein kurzer, holziger Ton. Läuft durch Jazz und Lounge.

