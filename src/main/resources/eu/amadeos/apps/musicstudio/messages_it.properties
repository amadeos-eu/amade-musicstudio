instrument.piano=Pianoforte
instrument.piano.about=Corde percosse che risuonano e si spengono. Sta bene con tutto, da solo o in compagnia.
instrument.electric-piano=Piano elettrico
instrument.electric-piano.about=Tasti morbidi, come campanelli. Il suono degli accordi rilassati del Lo-Fi.
instrument.organ=Organo
instrument.organ.about=Canne che suonano finché il tasto è premuto. Accordi caldi e note lunghe.
instrument.bells=Campanelli
instrument.bells.about=Piccole campane con una risonanza lunga e scintillante. Per melodie tranquille.
instrument.marimba=Marimba
instrument.marimba.about=Lamine di legno colpite con battenti morbidi. Breve e caldo, buono per melodie in Acustico, Lo-Fi e Chiptune.
instrument.strings=Archi
instrument.strings.about=Una sezione d'archi che cresce e si tiene. Grandi accordi per Avventura e Ambient.
instrument.harp=Arpa
instrument.harp.about=Corde pizzicate che suonano a lungo. Bella per gli accordi arpeggiati.
instrument.guitar=Chitarra pizzicata
instrument.guitar.about=Corde di nylon, pizzicate o strimpellate. Il suono da falò di Acustico.
instrument.flute=Flauto
instrument.flute.about=Un suono di fiato morbido e soffiato. Canta le melodie sopra tutto il resto.
instrument.warm-pad=Tappeto caldo
instrument.warm-pad.about=Un morbido tappeto di sintetizzatore che entra piano. La base di Ambient e Meditazione.
instrument.synth-lead=Lead synth
instrument.synth-lead.about=Una voce di sintetizzatore brillante che si fa sentire. Per le melodie Electro.
instrument.chip-square=Chip quadra
instrument.chip-square.about=L'onda quadra delle vecchie console. Melodie e accordi nel Chiptune.
instrument.chip-triangle=Chip triangolare
instrument.chip-triangle.about=La morbida onda triangolare delle vecchie console, soprattutto per il basso.
instrument.electric-bass=Basso elettrico
instrument.electric-bass.about=Un basso pizzicato, rotondo e breve.
instrument.synth-bass=Basso synth
instrument.synth-bass.about=Un basso di sintetizzatore con filtro. Deciso e moderno.
instrument.sub-bass=Sub-basso
instrument.sub-bass.about=Un tono grave quasi puro che si sente più col corpo che con le orecchie. Servono buoni altoparlanti.
instrument.male-ooh=Voce maschile Uuh
instrument.male-ooh.about=Un uomo canta un «uuh» morbido e scuro. Caldo per melodie e lunghe note di basso.
instrument.male-aah=Voce maschile Aah
instrument.male-aah.about=Un uomo canta un «aah» aperto. Porta una melodia con chiarezza.
instrument.female-ooh=Voce femminile Uuh
instrument.female-ooh.about=Una donna canta un «uuh» morbido. Melodie delicate sopra tutto il resto.
instrument.female-aah=Voce femminile Aah
instrument.female-aah.about=Una donna canta un «aah» aperto. Chiara e luminosa, per melodie che devono brillare.
instrument.child-ooh=Voce di bambino Uuh
instrument.child-ooh.about=Un bambino canta «uuh»: leggero e puro, con poco vibrato.
instrument.child-aah=Voce di bambino Aah
instrument.child-aah.about=Un bambino canta «aah»: chiaro e puro, con poco vibrato.
instrument.choir-ooh=Coro Uuh
instrument.choir-ooh.about=Sei voci su un «uuh» morbido, uomini per le note basse e donne per quelle alte. Un tappeto tranquillo di accordi.
instrument.choir-aah=Coro Aah
instrument.choir-aah.about=Sei voci su un «aah» aperto. Grandi accordi per Avventura e Ambient.
instrument.choir-mmm=Coro a bocca chiusa
instrument.choir-mmm.about=Sei voci che cantano a bocca chiusa. Scuro e vicino, bene sotto una melodia.

