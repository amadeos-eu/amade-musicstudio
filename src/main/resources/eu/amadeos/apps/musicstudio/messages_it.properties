format.ogg=OGG Vorbis
format.ogg.about=Piccolo, buono per giochi, pagine web e telefoni.
format.mod=Modulo tracker MOD (8 canali)
format.mod.about=Le note più gli strumenti come campioni, qualche centinaio di KB. Audio Station lo riproduce; i tracker lo modificano nota per nota.
format.midi=File MIDI
format.midi.about=Solo le note (General MIDI). Da aprire in un programma di notazione o sequencer.

