instrument.piano.about=Cuerdas percutidas que resuenan y se apagan. Va con todo, solo o acompañado.
instrument.electric-piano=Piano eléctrico
instrument.electric-piano.about=Teclas suaves, como campanillas. El sonido de los acordes relajados del Lo-Fi.
instrument.organ=Órgano
instrument.organ.about=Tubos que suenan mientras la tecla está pulsada. Acordes cálidos y notas largas.
instrument.bells=Campanillas
instrument.bells.about=Pequeñas campanas con una resonancia larga y brillante. Para melodías tranquilas.
instrument.marimba=Marimba
instrument.marimba.about=Láminas de madera golpeadas con mazas suaves. Corta y cálida, buena para melodías en Acústico, Lo-Fi y Chiptune.
instrument.strings=Cuerdas
instrument.strings.about=Una sección de cuerdas que crece y se sostiene. Grandes acordes para Aventura y Ambient.
instrument.harp=Arpa
instrument.harp.about=Cuerdas pulsadas que suenan largo. Preciosa para acordes arpegiados.
instrument.guitar=Guitarra punteada
instrument.guitar.about=Cuerdas de nailon, punteadas o rasgueadas. El sonido de fogata de Acústico.
instrument.flute=Flauta
instrument.flute.about=Un sonido de viento suave y soplado. Canta las melodías por encima de todo.
instrument.warm-pad=Colchón cálido
instrument.warm-pad.about=Una alfombra de sintetizador suave que entra despacio. La base de Ambient y Meditación.
instrument.synth-lead=Lead de sintetizador
instrument.synth-lead.about=Una voz de sintetizador brillante que destaca. Para melodías de Electro.
instrument.chip-square=Chip cuadrada
instrument.chip-square.about=La onda cuadrada de las consolas antiguas. Melodías y acordes en Chiptune.
instrument.chip-triangle=Chip triangular
instrument.chip-triangle.about=La onda triangular suave de las consolas antiguas, sobre todo para el bajo.
instrument.electric-bass=Bajo eléctrico
instrument.electric-bass.about=Un bajo pulsado, redondo y corto.
instrument.synth-bass=Bajo de sintetizador
instrument.synth-bass.about=Un bajo de sintetizador con filtro. Firme y moderno.
instrument.sub-bass=Subgrave
instrument.sub-bass.about=Un tono grave casi puro que se siente más que se oye. Necesita buenos altavoces.

