instrument.piano=Piano
instrument.piano.about=Struck strings that ring on and fade. Good for everything, alone or with others.
instrument.electric-piano=Electric Piano
instrument.electric-piano.about=Soft, bell-like keys. The sound of relaxed chords in Lo-Fi.
instrument.organ=Organ
instrument.organ.about=Pipes that sound as long as the key is held. Warm chords and long notes.
instrument.bells=Bells
instrument.bells.about=Small bells with a long, shimmering ring. Good for quiet melodies.
instrument.marimba=Marimba
instrument.marimba.about=Wooden bars struck with soft mallets. Short and warm, good for melodies in Acoustic, Lo-Fi and Chiptune pieces.
instrument.strings=Strings
instrument.strings.about=A string section that swells in and holds. Big chords for Adventure and Ambient.
instrument.harp=Harp
instrument.harp.about=Plucked strings that ring long. Lovely for broken chords.
instrument.guitar=Plucked Guitar
instrument.guitar.about=Nylon strings, plucked or strummed. The campfire sound of Acoustic.
instrument.flute=Flute
instrument.flute.about=A breathy, soft wind sound. Sings melodies above everything else.
instrument.warm-pad=Warm Pad
instrument.warm-pad.about=A soft synthesizer carpet that fades in slowly. The ground of Ambient and Meditation.
instrument.synth-lead=Synth Lead
instrument.synth-lead.about=A bright synthesizer voice that cuts through. For Electro melodies.
instrument.chip-square=Chip Square
instrument.chip-square.about=The square wave of old game consoles. Melodies and chords in Chiptune.
instrument.chip-triangle=Chip Triangle
instrument.chip-triangle.about=The soft triangle wave of old game consoles, mostly for the bass.
instrument.electric-bass=Electric Bass
instrument.electric-bass.about=A plucked bass guitar, round and short.
instrument.synth-bass=Synth Bass
instrument.synth-bass.about=A synthesizer bass with a filter. Firm and modern.
instrument.sub-bass=Sub Bass
instrument.sub-bass.about=A deep, almost pure tone you feel more than hear. Needs good speakers.
instrument.male-ooh=Male Voice Ooh
instrument.male-ooh.about=A man singing a soft, dark "ooh". Warm for melodies and long bass notes.
instrument.male-aah=Male Voice Aah
instrument.male-aah.about=A man singing an open "aah". Carries a melody clearly.
instrument.female-ooh=Female Voice Ooh
instrument.female-ooh.about=A woman singing a soft "ooh". Gentle melodies above everything else.
instrument.female-aah=Female Voice Aah
instrument.female-aah.about=A woman singing an open "aah". Bright and clear, for melodies that should shine.
instrument.child-ooh=Child's Voice Ooh
instrument.child-ooh.about=A child singing "ooh": light and pure, with little vibrato.
instrument.child-aah=Child's Voice Aah
instrument.child-aah.about=A child singing "aah": bright and pure, with little vibrato.
instrument.choir-ooh=Choir Ooh
instrument.choir-ooh.about=Six singers on a soft "ooh", men for low notes and women for high ones. A calm carpet of chords.
instrument.choir-aah=Choir Aah
instrument.choir-aah.about=Six singers on an open "aah". Big chords for Adventure and Ambient.
instrument.choir-mmm=Choir Humming
instrument.choir-mmm.about=Six singers humming with closed lips. Dark and close, good under a melody.

