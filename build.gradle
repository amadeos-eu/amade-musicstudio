plugins {
    id 'java'
    id 'application'
}

group = 'eu.amadeos'
// CI computes the version from the Conventional Commits since the last release tag and passes it as
// -PappVersion (amadeos-eu/amadeos-ci scripts/next-version.sh); a build without it is a local development build.
version = findProperty('appVersion') ?: '0.0.0-dev.0'
// Debian sorts 1.1.0~dev.57 before 1.1.0 (with - it would sort after it).
def debVersion = version.toString().replace('-', '~')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'eu.amadeos.apps.musicstudio.bootstrap.AmadeMusicStudioApplication'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Theme, Motif look, start-up and XDG helpers shared by all amadeOS applications.
    // With ../amade-commons checked out, settings.gradle builds that checkout instead (composite build).
    implementation 'com.github.amadeos-eu:amade-commons:82d0f99f19'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Tests compare English texts, whatever the language of the build machine.
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
}

// --8<-- [start:jar]
jar {
    archiveBaseName = 'amade-musicstudio'
    manifest {
        attributes(
            'Main-Class': 'eu.amadeos.apps.musicstudio.bootstrap.AmadeMusicStudioApplication',
            'Implementation-Title': 'amade-musicstudio',
            'Implementation-Version': project.version
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // Signed dependency jars would otherwise invalidate the fat jar.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
// --8<-- [end:jar]

tasks.register('deb') {
    dependsOn jar
    description = 'Builds a standard Debian (.deb) package for amade-musicstudio'
    group = 'distribution'

    doLast {
        def buildDirFile = layout.buildDirectory.get().asFile
        def stagingDir = new File(buildDirFile, 'deb-staging')
        delete(stagingDir)

        def optDir = new File(stagingDir, 'opt/amade-musicstudio')
        def binDir = new File(stagingDir, 'usr/bin')
        def appDir = new File(stagingDir, 'usr/share/applications')
        def iconDir = new File(stagingDir, 'usr/share/icons/hicolor/48x48/apps')
        def docDir = new File(stagingDir, 'usr/share/doc/amade-musicstudio')
        def debianDir = new File(stagingDir, 'DEBIAN')
        def distDir = new File(buildDirFile, 'distributions')
        [optDir, binDir, appDir, iconDir, docDir, debianDir, distDir]*.mkdirs()

        copy {
            from jar.archiveFile
            into optDir
            rename { 'amade-musicstudio.jar' }
        }

        // --8<-- [start:deb-files]
        def launcher = new File(binDir, 'amade-musicstudio')
        // The options all amadeOS programs share (heap, garbage collector) come first from the argument file
        // amadeos-session installs; the options after it win over them.
        // The shared options give programs only the quick C1 compiler; this program computes a lot and takes the
        // optimising compiler back with -XX:TieredStopAtLevel=4.
        launcher.text = """#!/bin/sh
OPTIONS=/etc/amadeos/java/app.options
[ -r "\$OPTIONS" ] || OPTIONS=/dev/null
exec /usr/bin/java "@\$OPTIONS" -Xmx1g -XX:TieredStopAtLevel=4 -jar /opt/amade-musicstudio/amade-musicstudio.jar "\$@"
"""
        launcher.setExecutable(true, false)

        copy {
            from 'packaging/amade-musicstudio.desktop'
            into appDir
        }
        // AppStream metadata: name, description and screenshot for amadeOS Software (and a repository's
        // appstream-generator).
        copy {
            from 'packaging/eu.amadeos.apps.musicstudio.metainfo.xml'
            into new File(stagingDir, "usr/share/metainfo")
        }
        copy {
            from 'src/main/resources/icons/amade-musicstudio.png'
            into iconDir
        }
        copy {
            from 'LICENSE'
            into docDir
            rename { 'copyright' }
        }
        // --8<-- [end:deb-files]

        // --8<-- [start:deb-control]
        new File(debianDir, 'control').text = """Package: amade-musicstudio
Version: ${debVersion}
Section: sound
Priority: optional
Architecture: all
Depends: openjdk-25-jre | java-runtime (>= 25), amadeos-java-options
Recommends: gstreamer1.0-tools, gstreamer1.0-plugins-base
Maintainer: amadeOS Project <developers@datazuul.com>
Description: Offline music studio for amadeOS
 Composes music with rules and a built-in synthesizer, fully offline:
 ambient, lo-fi, chiptune, piano, electro, meditation, acoustic and
 adventure. A recipe (style, seed, sliders and instruments) always gives
 the same piece. Sliders for tempo, hardness, swing, energy, fills,
 brightness, reverb and vinyl crackle; sixteen synthesized instruments
 and four drum kits; mute, solo and keep per part; variations and
 history. Export as WAV, FLAC, OGG, MOD tracker module or MIDI, with the
 recipe inside. Part of the amadeOS desktop.
"""

        def debFile = new File(distDir, "amade-musicstudio_${debVersion}_all.deb")
        def process = new ProcessBuilder('dpkg-deb', '--root-owner-group', '--build',
                stagingDir.absolutePath, debFile.absolutePath)
                .redirectErrorStream(true)
                .start()
        process.inputStream.eachLine { println it }
        if (process.waitFor() != 0) {
            throw new GradleException('dpkg-deb failed')
        }
        println "[deb] Created ${debFile.absolutePath}"
        // --8<-- [end:deb-control]
    }
}

// --8<-- [start:install]
tasks.register('installToAmadeOs') {
    dependsOn 'deb'
    description = 'Builds and drops the .deb package into ../amadeos/config/packages.chroot/'
    group = 'distribution'

    doLast {
        def targetDir = file('../amadeos/config/packages.chroot')
        targetDir.mkdirs()
        def debFile = new File(layout.buildDirectory.get().asFile, "distributions/amade-musicstudio_${debVersion}_all.deb")
        copy {
            from debFile
            into targetDir
        }
        println "[installToAmadeOs] Copied ${debFile.name} to ${targetDir.absolutePath}"
    }
}
// --8<-- [end:install]

// --8<-- [start:windows]
// Windows installer with jpackage: the fat jar plus a Java runtime, so Windows users need no Java.
// jpackage builds Windows packages only on Windows; MSI and EXE also need WiX Toolset 3 on the PATH.
//   ./gradlew windowsInstaller                           (MSI; output in build/windows/<type>/)
//   ./gradlew windowsInstaller -PinstallerType=exe       (setup .exe)
//   ./gradlew windowsInstaller -PinstallerType=app-image (folder with amade-musicstudio.exe, no WiX needed)
tasks.register('windowsInstaller') {
    dependsOn jar
    description = 'Builds a Windows installer (MSI, EXE or app image) with jpackage'
    group = 'distribution'

    def jdk = javaToolchains.launcherFor { languageVersion = java.toolchain.languageVersion }
    doLast {
        if (!System.getProperty('os.name').startsWith('Windows')) {
            throw new GradleException('jpackage builds Windows packages only on Windows')
        }
        def type = project.findProperty('installerType') ?: 'msi'
        def buildDirFile = layout.buildDirectory.get().asFile
        // jpackage bundles everything in --input, so give it a folder with just the fat jar.
        def inputDir = new File(buildDirFile, 'jpackage-input')
        def destDir = new File(buildDirFile, "windows/$type")
        delete(inputDir, destDir)
        copy {
            from jar.archiveFile
            into inputDir
        }

        def jpackage = jdk.get().metadata.installationPath.file('bin/jpackage.exe').asFile
        def args = [jpackage.absolutePath,
                    '--type', type,
                    '--name', 'amade-musicstudio',
                    // MSI versions are numeric only: 1.1.0-dev.57 becomes 1.1.0
                    '--app-version', project.version.toString().replaceAll(/[^0-9.].*$/, ''),
                    '--vendor', 'datazuul',
                    '--description', 'Offline music studio',
                    '--copyright', 'datazuul, licensed under the EUPL-1.2',
                    '--input', inputDir.absolutePath,
                    '--main-jar', jar.archiveFile.get().asFile.name,
                    '--main-class', application.mainClass.get(),
                    '--icon', file('packaging/windows/amade-musicstudio.ico').absolutePath,
                    '--dest', destDir.absolutePath]
        if (type != 'app-image') {
            args += ['--win-menu', '--win-menu-group', 'amadeOS', '--win-shortcut', '--win-dir-chooser',
                     '--license-file', file('LICENSE').absolutePath,
                     // Never change: lets a newer installer replace an installed version.
                     '--win-upgrade-uuid', '8b93ecf5-d630-4ebc-80b0-4c21b34633e8']
        }

        def process = new ProcessBuilder(args).redirectErrorStream(true).start()
        process.inputStream.eachLine { println it }
        if (process.waitFor() != 0) {
            throw new GradleException('jpackage failed')
        }
        destDir.eachFile { println "[windowsInstaller] Created ${it.absolutePath}" }
    }
}
// --8<-- [end:windows]
